[package]
name = "search"
version = "0.1.0"
edition = "2024"
description = "Parallel Search cache for Bunny Magic Containers"

[dependencies]
blake3 = "1"
bytes = "1"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip"] }
salvo = { version = "0.95", features = ["affix-state", "compression", "cors", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  MUSL_TARGET: x86_64-unknown-linux-musl

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Builds a static musl binary on the runner (rust-cache makes warm builds
  # fast), then the Docker step is a plain COPY. Runs in parallel with test;
  # deploy waits for both.
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.MUSL_TARGET }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.MUSL_TARGET }}
      - run: cargo build --release --locked --target ${{ env.MUSL_TARGET }}
      - run: mkdir -p dist && cp target/${{ env.MUSL_TARGET }}/release/search dist/search
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Rolls the Bunny Magic Containers app to the new image.
  # Enable by setting the BUNNY_APP_ID repo variable and BUNNY_API_KEY secret.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BUNNY_APP_ID != ''
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      - uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNY_API_KEY }}
          container: search
          image_tag: sha-${{ github.sha }}
